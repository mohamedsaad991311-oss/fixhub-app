name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *' # كل يوم الساعة 2 صباحاً
  workflow_dispatch: # يدوياً من GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Backup Roles
        run: supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" -f roles.sql --role-only
      
      - name: Backup Schema
        run: supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" -f schema.sql
      
      - name: Backup Data
        run: supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" -f data.sql --data-only --use-copy
      
      - name: Upload Backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: |
            roles.sql
            schema.sql
            data.sql
          retention-days: 30