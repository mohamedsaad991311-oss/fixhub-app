name: Build FixHub APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: amyu/setup-android@v6.0
        with:
          sdk-version: '36'
          build-tools-version: '36.0.0'

      - name: Get dependencies
        run: flutter pub get

      # 🔐 فك تشفير الـ keystore من GitHub Secret
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      # 🔐 إنشاء key.properties من GitHub Secrets
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK Release
        run: flutter build apk --release

      - name: Build APK Debug (fallback)
        if: failure()
        run: flutter build apk --debug

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fixhub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK (fallback)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixhub-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7