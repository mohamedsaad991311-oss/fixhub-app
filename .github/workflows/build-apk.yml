name: Build FixHub APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
          - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # هذا الخيار يحذف أدوات .NET و Haskell وغيرها لتوفير مساحة
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      -          - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fixhub-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7